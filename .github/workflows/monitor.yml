name: Shift-Right API Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Health Check & Monitor
        run: |
          newman run "2273404050012_NguyenTanSang_GoRest.postman_collection.json" \
            -e "2273404050012_NguyenTanSang_GoRest_Env.postman_environment.json" \
            --env-var "token=${{ secrets.GOREST_TOKEN }}"
